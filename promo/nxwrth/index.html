<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101211">
  <meta name="robots" content="noindex, nofollow">
  <title>KONK! Has a Sound — Promo Director</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/konk-favicon.svg">
  <link rel="preload" as="image" href="../../assets/konk-logo.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
  <link rel="stylesheet" href="../../styles/konk-brand-cursors.css?v=4">
  <link rel="stylesheet" href="./promo.css?v=2">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main class="director">
    <header class="director-bar">
      <a class="brand" href="/" aria-label="KONK! home"><img src="../../assets/konk-logo.svg" alt="KONK!"></a>
      <span class="bar-label">CINEMATIC DIRECTOR <i></i> ROADSIDE SHOWDOWN</span>
      <div class="bar-actions"><select id="canvas-format" aria-label="Preview format"><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select><button id="capture-mode" class="utility" type="button">CAPTURE MODE</button></div>
    </header>
    <section class="film-frame" id="film-frame" aria-label="KONK! cinematic preview">
      <canvas id="promo-canvas" aria-label="Animated Counters Ball cinematic"></canvas>
      <canvas id="promo-type-canvas" aria-hidden="true"></canvas>
      <div id="load-state" class="load-state">
        <span class="kicker">THE SOUND REVEAL</span>
        <h1>KONK! HAS A SOUND.</h1>
        <p>Press Play Film to watch with sound.</p>
      </div>
      <div id="error-state" class="error-state" role="alert" hidden></div>
    </section>
    <section class="controls" id="controls" aria-label="Promo controls">
      <div class="control-top">
        <div class="playback">
          <button id="play" class="primary" type="button">PLAY FILM</button>
          <button id="pause" class="secondary" type="button" disabled>PAUSE</button>
          <button id="restart" class="secondary" type="button">RESTART</button>
          <button id="mute" class="secondary" type="button" aria-pressed="false">MUTE</button>
          <button id="record" class="secondary" type="button" disabled>RECORD</button>
          <button id="fullscreen" class="secondary" type="button">FULL SCREEN</button>
        </div>
        <div id="clock-label" class="clock-label">00:00 <span>/ 00:27</span></div>
      </div>
      <label class="scrub-label" for="scrub">FILM TIMELINE <span>Drag to inspect; the artist reveal stays locked before the tag.</span></label>
      <input id="scrub" type="range" min="0" max="27" step="0.01" value="0" aria-label="Scrub promo timeline">
      <div class="setup-row">
        <label class="file-pick">MASTER AUDIO <input id="audio-file" type="file" accept="audio/*"></label>
        <label>SECTION START <input id="section-start" type="number" min="0" step="0.1" value="0"></label>
        <label>BEAT ENTRY <input id="beat-entry" type="number" min="0" step="0.1" value="3.4"></label>
        <label>NORTH!!! TAG <input id="tag-time" type="number" min="0" step="0.01" value="12"></label>
        <label>FILM LENGTH <input id="film-length" type="number" min="25" max="30" step="0.1" value="27"></label>
        <button id="silent-preview" class="secondary" type="button">SILENT PREVIEW</button>
        <span id="audio-status" class="audio-status" aria-live="polite">Master not loaded · tag cue set to 00:12</span>
      </div>
      <p class="notice">NXWRTH · Afro Rave 35. The producer-tag cue is set to 12 seconds.</p>
    </section>
    <footer class="director-foot"><span>GHANA TO THE WORLD.</span><span>DEVELOPMENT VIEW · NOT INDEXED</span></footer>
  </main>
  <script type="module" src="./main.js?v=13"></script>
</body>
</html>
