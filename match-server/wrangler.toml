# KONK! Message Match server. Deploy: npx wrangler deploy (after `npx wrangler login`).
name = "konk-match-server"
main = "src/konk-match-worker-and-durable-object.js"
compatibility_date = "2026-09-01"

[vars]
# Pages that may call the API from the browser.
ALLOWED_ORIGINS = "https://konk.world,http://localhost:4180"

[[durable_objects.bindings]]
name = "KONK_MATCH"
class_name = "KonkMatch"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["KonkMatch"]
