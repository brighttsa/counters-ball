# Publishes only what the game loads to konk.world, after the full test suite passes.
# Repo notes, docs and tests stay off the live site.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch the exact Three.js build the game imports
        run: curl --fail --location --max-time 30 https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js --output "$RUNNER_TEMP/three-r160.mjs"
      - name: Run tests
        run: COUNTERS_TEST_THREE="$RUNNER_TEMP/three-r160.mjs" node --test tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect runtime files only
        run: |
          mkdir _site
          cp -R index.html assets src styles CNAME _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
