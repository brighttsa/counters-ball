<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KONK! Table Talk — Compact Control Preview</title>
<link rel="stylesheet" href="../../../styles/game-ui-base-and-hud.css?v=1">
<link rel="stylesheet" href="../../../styles/match-hud-one-frame-and-aim-fade.css?v=8">
<link rel="stylesheet" href="../../../styles/table-talk.css?v=5">
<style>
  body { min-height: 100vh; padding: 24px; background: #171816; color: var(--paper); font: 16px/1.5 var(--font-body); }
  main { width: min(100%, 900px); margin: 0 auto; }
  h1 { margin: 0 0 20px; font: 800 24px/1.2 var(--font-heading); }
  section { margin: 0 0 24px; padding: 20px; border: 1px solid rgb(var(--paper-rgb) / .16); background: rgb(var(--ink-rgb) / .88); }
  h2 { margin: 0 0 8px; font: 700 14px/1.3 var(--font-body); }
  p { margin: 0 0 8px; color: rgb(var(--paper-rgb) / .74); }
  .sample-match { min-height: 250px; position: relative; padding-top: 54px; background: linear-gradient(135deg, #38433a, #18201b); }
  .sample-match .table-talk-controls { position: relative; top: auto; left: auto; }
  .table-talk-controls[hidden] { display: none; }
</style>
<main>
  <h1>Table Talk · Compact Control Preview</h1>
  <section>
    <h2>Room card · connected · microphone off</h2>
    <p>Play someone live · Roadside Showdown</p>
    <aside class="table-talk-controls" data-state="listening" data-compact="true" aria-label="Table Talk voice">
      <button class="table-talk-toggle" data-table-talk-toggle type="button" aria-controls="room-actions" aria-expanded="false">Voice · Mic off</button>
      <span class="visually-hidden" aria-live="polite" aria-atomic="true">Connected · mic off</span>
      <div class="table-talk-actions" id="room-actions" data-table-talk-actions hidden>
        <span class="table-talk-label">Connected · mic off</span>
        <button class="btn btn-small" type="button" hidden>Join voice</button>
        <button class="btn btn-small" type="button">Enable microphone</button>
        <button class="icon-btn table-talk-leave" type="button" aria-label="Leave voice">×</button>
      </div>
    </aside>
  </section>
  <section class="sample-match">
    <h2>Match HUD · connected · microphone on</h2>
    <p>Active match controls stay in the existing HUD-safe corner.</p>
    <aside class="table-talk-controls" data-in-match="true" data-state="speaking" data-compact="false" aria-label="Table Talk voice">
      <button class="table-talk-toggle" data-table-talk-toggle type="button" aria-controls="match-actions" aria-expanded="true" aria-label="Collapse voice controls. Microphone on.">Hide voice controls</button>
      <span class="visually-hidden" aria-live="polite" aria-atomic="true">Microphone on</span>
      <div class="table-talk-actions" id="match-actions" data-table-talk-actions>
        <span class="table-talk-label">Microphone on</span>
        <button class="btn btn-small" type="button">Mute microphone</button>
        <button class="icon-btn table-talk-leave" type="button" aria-label="Leave voice">×</button>
      </div>
    </aside>
  </section>
</main>
<script type="module">
  import { createTableTalkCompactControl } from '../../../src/ui/table-talk-compact-control.js';
  document.querySelectorAll('.table-talk-controls').forEach(root => {
    const control = createTableTalkCompactControl(root);
    let compact = root.dataset.compact === 'true';
    control.button.addEventListener('click', () => {
      compact = !compact;
      control.setCompact(compact, root.dataset.state);
    });
  });
</script>
