<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KONK! — Bottle-Cap Football</title>
<meta name="description" content="Flick bottle caps across tiny street pitches in Ghana. Thread the gap, bank it off a rival, score the goal the whole street talks about." />
<!-- Link previews: a shared result or challenge link shows the key art in chat apps. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="KONK!" />
<meta property="og:title" content="KONK! — Bottle-Cap Football" />
<meta property="og:description" content="Small pitch. Big mouth. Flick bottle caps across Ghanaian street tables." />
<meta property="og:image" content="https://counters-ball-3d.vercel.app/assets/konk-share-preview.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="675" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="#191b1b" />
<link rel="icon" type="image/svg+xml" href="assets/konk-favicon.svg" />
<link rel="apple-touch-icon" href="assets/konk-app-icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Cabin+Sketch:wght@700&family=Lilita+One&family=Patrick+Hand&display=swap" />
<link rel="stylesheet" href="styles/game-ui-base-and-hud.css" />
<link rel="stylesheet" href="styles/game-ui-menus-and-results.css" />
<link rel="stylesheet" href="styles/circuit-venue-preview.css" />
<link rel="stylesheet" href="styles/street-legends-mode.css" />
<link rel="stylesheet" href="styles/ink-impact-home.css" />
<link rel="stylesheet" href="styles/player-camera-controls.css" />
<link rel="stylesheet" href="styles/mobile-tablet-match-layout.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="game-canvas" aria-label="Tabletop football pitch"></canvas>
  <div id="film-frame"></div>

  <section class="screen screen-title" data-screen="title">
    <h1 class="home-logo"><img src="assets/konk-logo.svg" width="1390" height="680" alt="KONK! Bottle-cap football" /></h1>
    <p class="tagline">Small pitch. Big mouth.</p>
    <p class="home-edition">Street Legends · featured</p>
    <div class="home-location"><b id="home-feature-act">ACT 1 / 3</b><span><span id="home-feature-venue">Roadside Showdown</span><br><span id="home-feature-title"></span></span></div>
    <nav class="menu-stack">
      <button class="btn btn-primary home-play home-learn" data-action="play-practice" hidden><span class="home-learn-label">Learn with Kwame <small>2-minute practice</small></span> <span aria-hidden="true">↗</span></button>
      <button class="btn home-just-play" data-action="skip-practice" hidden>I know how to play: just play</button>
      <button class="btn btn-primary home-play home-featured" data-action="play-featured"><span id="home-feature-button">Play Roadside</span> <span aria-hidden="true">↗</span></button>
      <button class="btn home-venues" data-action="play-legends">See all 18 acts</button>
      <div class="home-secondary"><button class="btn" data-action="play-practice">Practice with Kwame</button>
      <button class="btn" data-action="play-campaign">Classic Campaign</button>
      <button class="btn" data-action="play-versus">2-Player Table</button></div>
    </nav>
    <p class="title-stars" id="title-stars"></p>
  </section>

  <section class="screen screen-levels" data-screen="levels">
    <header class="screen-header">
      <button class="btn btn-small" data-action="back-to-title">← Back</button>
      <h2 class="chalk-heading" id="levels-heading">The Circuit</h2>
      <span class="star-total" id="levels-star-total"></span>
    </header>
    <article class="circuit-hero" aria-labelledby="circuit-venue-name">
      <div class="circuit-venue-copy" aria-live="polite" aria-atomic="true">
        <p class="card-kicker" id="circuit-match-number"></p>
        <h3 id="circuit-venue-name"></h3>
        <p id="circuit-venue-place"></p>
        <p id="circuit-venue-opponent"></p>
        <p id="circuit-venue-conditions"></p>
        <p id="circuit-venue-rules"></p>
        <p id="circuit-venue-note"></p>
        <p id="circuit-venue-stars"></p>
      </div>
      <button class="btn btn-primary" id="circuit-enter" data-action="select-level" disabled>Play this match</button>
      <p id="circuit-lock-note"></p>
    </article>
    <nav class="level-grid" id="level-grid" aria-label="Ghana venue circuit"></nav>
  </section>

  <section class="screen screen-intro" data-screen="intro">
    <article class="paper-card intro-card">
      <span class="tape tape-left"></span><span class="tape tape-right"></span>
      <p class="card-kicker" id="intro-number"></p>
      <h2 class="card-title" id="intro-title"></h2>
      <p class="intro-place" id="intro-place"></p>
      <p class="intro-blurb" id="intro-blurb"></p>
      <div class="intro-versus" id="intro-versus">
        <span class="team-chip" id="intro-home"></span><span class="vs">vs</span><span class="team-chip" id="intro-away"></span>
      </div>
      <div class="intro-names" id="intro-names" hidden>
        <label class="name-field" id="intro-name-home-field"><span id="intro-name-home-team"></span>
          <input id="intro-name-home" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done"></label>
        <span class="vs">vs</span>
        <label class="name-field" id="intro-name-away-field"><span id="intro-name-away-team"></span>
          <input id="intro-name-away" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done"></label>
      </div>
      <ul class="intro-rules" id="intro-rules"></ul>
      <div class="card-actions">
        <button class="btn btn-small" data-action="intro-back" data-track-label="{track}">Pitches</button>
        <button class="btn btn-primary" data-action="kick-off">Kick off</button>
      </div>
    </article>
  </section>

  <section class="screen screen-challenge" data-screen="challenge">
    <article class="paper-card intro-card challenge-card" aria-labelledby="challenge-title">
      <p class="card-kicker">Your friend left a mark</p>
      <h2 class="card-title" id="challenge-title"></h2>
      <p class="intro-place" id="challenge-venue"></p>
      <p class="intro-blurb" id="challenge-mark"></p>
      <div class="card-actions">
        <button class="btn btn-small" data-action="challenge-decline">Later</button>
        <button class="btn btn-primary" data-action="challenge-accept">Play their table</button>
      </div>
    </article>
  </section>

  <section id="hud" class="hud-layer" hidden>
    <div class="scoreboard">
      <span class="turn-dot home" id="turn-dot-home"></span>
      <span class="team-name" id="hud-home-name"></span>
      <span class="score-digits"><span id="score-home">0</span><span class="dash">–</span><span id="score-away">0</span></span>
      <span class="team-name" id="hud-away-name"></span>
      <span class="turn-dot away inactive" id="turn-dot-away"></span>
    </div>
    <div class="flick-meter"><b id="flicks-home"></b><span>flicks left</span><b id="flicks-away"></b></div>
    <button class="icon-btn pause-btn" data-action="pause" aria-label="Pause">❚❚</button>
    <div class="turn-banner" id="turn-banner" aria-live="polite"></div>
    <div class="legend-objective" id="hud-objective" aria-live="polite" hidden></div>
    <div class="goal-banner" id="goal-banner" role="status" aria-live="polite" aria-atomic="true" hidden><span class="goal-word">GOAL</span><span class="goal-sub" id="goal-sub"></span></div>
    <div class="replay-controls" id="replay-controls" hidden><span id="replay-label">Replay</span><button class="btn btn-small" data-action="skip-replay">Skip replay</button></div>
    <div class="tutorial-hand" id="tutorial-hand" hidden>
      <span class="tutorial-ring"></span>
      <svg class="tutorial-finger" viewBox="0 0 48 64" aria-hidden="true"><path d="M20 4c3 0 5 2 5 5v18l12 3c4 1 6 4 5 8l-3 15c-1 5-5 9-10 9H19c-4 0-7-2-9-6L3 42c-1-3 1-6 4-6 2 0 4 1 5 3l3 5V9c0-3 2-5 5-5z" fill="#fdf6e6" stroke="#2b1a0c" stroke-width="3" stroke-linejoin="round"/></svg>
      <span class="tutorial-tip">Drag back from a cap. Release to flick.<span class="tutorial-keys"> Or press Space to aim with the keyboard.</span></span>
    </div>
  </section>

  <section class="screen screen-pause" data-screen="pause">
    <article class="paper-card menu-card">
      <span class="tape tape-left"></span>
      <h2 class="card-title">Paused</h2>
      <nav class="menu-stack">
        <button class="btn btn-primary" data-action="resume">Resume</button>
        <button class="btn" data-action="restart">Restart match</button>
        <button class="btn" id="camera-motion-toggle" data-action="toggle-camera-motion" aria-pressed="true">Camera motion</button>
        <button class="btn" id="camera-view-toggle" data-action="cycle-camera-view" data-value="Broadcast">Camera view</button>
        <button class="btn" id="hud-style-toggle" data-action="toggle-hud-style" data-value="Chalk">Scoreboard</button>
        <button class="btn" id="hints-reset" data-action="reset-hints">Show tips again</button>
        <button class="btn" data-action="how-to-play">How to play · Kwame's Corner</button>
        <button class="btn" data-action="quit" data-track-label="Quit to {track}">Quit to Pitches</button>
      </nav>
    </article>
  </section>

  <section class="screen screen-results" data-screen="results">
    <article class="paper-card results-card">
      <span class="tape tape-right"></span>
      <p class="card-kicker">Full Time</p>
      <h2 class="card-title results-title" id="results-title"></h2>
      <p class="results-score" id="results-score"></p>
      <p class="results-opponent" id="results-opponent"></p>
      <ul class="results-stars" id="results-stars"></ul>
      <p class="results-note" id="results-note"></p>
      <ul class="results-lines" id="results-lines"></ul>
      <div class="card-actions">
        <button class="btn btn-small" data-action="results-levels" data-track-label="{track}">Pitches</button>
        <button class="btn" data-action="share-result" id="btn-share">Share</button>
        <button class="btn" data-action="replay" id="btn-replay">Play again</button>
        <button class="btn btn-primary" data-action="next-level" id="btn-next">Next pitch</button>
      </div>
      <p class="results-share-status" id="results-share-status" aria-live="polite"></p>
    </article>
  </section>

  <button class="icon-btn sound-btn" id="sound-toggle" data-action="toggle-sound" aria-label="Sound is on" aria-pressed="true">♪</button>
  <noscript><p class="noscript">KONK! needs JavaScript and WebGL to run.</p></noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
